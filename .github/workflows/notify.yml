name: MANIT notice check

on:
  schedule:
    # Backup only: the main trigger is cron-job.org calling workflow_dispatch every 10 min.
    # Offset from :00/:10 because GitHub drops/delays on-the-minute schedules most.
    - cron: "3-59/10 * * * *"
  workflow_dispatch:          # manual runs + external cron-job.org trigger

permissions:
  contents: write

concurrency:
  group: manit-notify
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check for new notices
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python notifier.py

      - name: Save seen notices
        run: |
          git config user.name "notice-bot"
          git config user.email "notice-bot@users.noreply.github.com"
          git add seen.json
          git diff --cached --quiet || (git commit -m "Update seen notices" && git push)
